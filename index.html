<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MANHARA KKPGEN Insurance</title>


<style>

body{
font-family:Arial,"Sarabun",sans-serif;
background:#f5f3fb;
padding:30px;
}


.container{

max-width:1100px;
margin:auto;
background:white;
padding:30px;
border-radius:20px;

}


h1,h2,h3{

color:#4b4387;

}


label{

font-weight:bold;
display:block;
margin-top:15px;

}


input,select{

width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;

}


button{

margin-top:25px;
padding:15px 25px;
border:none;
border-radius:12px;
background:#635f92;
color:white;
font-size:18px;
cursor:pointer;

}


.card{

margin-top:20px;
background:#faf8ff;
padding:20px;
border-radius:15px;

}


.star{

font-size:35px;

}


.tag{

display:inline-block;
padding:8px 12px;
margin:5px;
border-radius:20px;
background:#eee8ff;
color:#51448c;

}


.rank{

background:white;
padding:15px;
margin-top:10px;
border-radius:10px;

}


</style>


</head>



<body>


<div class="container">


<h1>
MANHARA Model
</h1>


<p>
เครื่องมือวิเคราะห์ลูกค้าเพื่อแนะนำผลิตภัณฑ์ที่เหมาะสม
</p>



<label>อายุ</label>

<input id="age"
type="number"
placeholder="เช่น 45">



<label>งบเบี้ยต่อปี</label>

<input id="budget"
type="number"
placeholder="เช่น 50000">



<label>Authority</label>

<select id="authority"></select>


<label>Need</label>

<select id="need"></select>


<label>Horizon</label>

<select id="horizon"></select>


<label>Attitude</label>

<select id="attitude"></select>


<label>Risk</label>

<select id="risk"></select>


<label>Action</label>

<select id="action"></select>



<button onclick="analyze()">

ประเมินแผนที่เหมาะสม

</button>



<div id="result"></div>



</div>





<script>


const API_URL =

"https://script.google.com/macros/s/AKfycbw7Zyyc2RiYjgz_oP5kBSVmDMsvlCNMG-3OgdnLGcCP0UMJE2Fw1ClIXFOo4M2jeBVH/exec";




// =======================
// LOAD DROPDOWN
// =======================


async function loadData(){

  try{

    const response = await fetch(
      API_URL + "?action=getDropdownData&t=" + Date.now(),
      { cache: "no-store" }
    );

    if(!response.ok){
      throw new Error("HTTP " + response.status);
    }

    const json = await response.json();

    console.log("FULL API RESPONSE =", json);

    if(json.error){
      throw new Error(json.error);
    }

    const data = json.data || {};

    createSelect(
      "authority",
      data.Authority || []
    );

    createSelect(
      "need",
      data.Need || []
    );

    createSelect(
      "horizon",
      data.Horizon || []
    );

    createSelect(
      "attitude",
      data.Attitude || []
    );

    createSelect(
      "risk",
      data.Risk || []
    );

    createSelect(
      "action",
      data.Action || []
    );

  } catch(error){

    console.error(
      "LOAD DROPDOWN ERROR =",
      error
    );

    alert(
      "โหลดข้อมูล dropdown ไม่สำเร็จ : " +
      error.message
    );

  }

}


createSelect(

"authority",

data.Authority || []

);


createSelect(

"need",

data.Need || []

);


createSelect(

"horizon",

data.Horizon || []

);


createSelect(

"attitude",

data.Attitude || []

);


createSelect(

"risk",

data.Risk || []

);


createSelect(

"action",

data.Action || []

);



}

catch(error){


alert(

"โหลดข้อมูล dropdown ไม่สำเร็จ : "

+

error.message

);


}


}





function createSelect(id,list){

  const el =
    document.getElementById(id);

  if(!el){
    console.error("ไม่พบ element:", id);
    return;
  }

  el.innerHTML =
    "<option value=''>-- กรุณาเลือก --</option>";

  (list || []).forEach(item=>{

    const option =
      document.createElement("option");

    option.value = item;
    option.textContent = item;

    el.appendChild(option);

  });

}





// =======================
// ANALYZE
// =======================


async function analyze(){



let params = new URLSearchParams({


action:"preview",


age:

document.getElementById("age").value,


budget:

document.getElementById("budget").value,


authority:

document.getElementById("authority").value,


need:

document.getElementById("need").value,


horizon:

document.getElementById("horizon").value,


attitude:

document.getElementById("attitude").value,


risk:

document.getElementById("risk").value,


plan_action:

document.getElementById("action").value



});





const response = await fetch(

API_URL+"?"+params.toString()

);



const data = await response.json();



showResult(data);



}







// =======================
// SHOW RESULT
// =======================


function showResult(data){


let html="";



html += `

<div class="card">


<h2>

${data.stars || ""}

${data.recommended_product}

</h2>


<h3>

${data.suitability}

</h3>


<h3>

คะแนน ${data.score}

</h3>


</div>

`;




html += `

<div class="card">

<h3>
🏷 Customer Tag
</h3>

`;



(data.customer_tags || [])

.forEach(tag=>{


html +=

`

<span class="tag">
${tag}
</span>

`;



});



html += "</div>";





html += `

<div class="card">

<h3>
เหตุผลที่แนะนำ
</h3>

<ul>

`;



(data.reason || [])

.forEach(r=>{


html +=

`

<li>${r}</li>

`;



});



html +=`

</ul>

</div>

`;






html +=`

<div class="card">

<h3>
รายละเอียดผลิตภัณฑ์
</h3>

<ul>

`;



(data.product_summary || [])

.forEach(x=>{


html +=

`

<li>${x}</li>

`;



});



html +=`

</ul>

</div>

`;





html +=`

<div class="card">

<h3>
Ranking
</h3>

`;



(data.ranked_products || [])

.forEach(p=>{


html +=

`

<div class="rank">

${p.stars}

<b>${p.product_name}</b>

<br>

คะแนน ${p.score}

</div>

`;



});



html +=`

</div>

`;





document.getElementById("result").innerHTML=html;



}






loadData();



</script>


</body>

</html>

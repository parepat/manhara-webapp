<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MANHARA KKPGEN Insurance</title>


<style>

body{

font-family:
"Sarabun",
Arial,
sans-serif;

background:#f6f4fb;

margin:0;

padding:30px;

color:#333;

}


.container{

max-width:1200px;

margin:auto;

background:white;

padding:30px;

border-radius:20px;

box-shadow:0 5px 20px rgba(0,0,0,.08);

}



h1{

color:#3f3578;

}



.section{

margin-top:25px;

}



label{

font-weight:bold;

display:block;

margin-top:15px;

}


input,select{

width:100%;

padding:12px;

border-radius:10px;

border:1px solid #ddd;

font-size:16px;

}



button{

margin-top:25px;

padding:15px 30px;

background:#635f92;

color:white;

border:none;

border-radius:12px;

font-size:18px;

cursor:pointer;

}



button:hover{

background:#4c4778;

}



.card{

margin-top:20px;

padding:20px;

border-radius:15px;

background:#faf8ff;

border:1px solid #ddd;

}



.star{

font-size:35px;

color:#f5b800;

}



.tag{

display:inline-block;

background:#eee8ff;

color:#51448c;

padding:6px 12px;

margin:5px;

border-radius:20px;

}



.reason li{

margin-bottom:8px;

}



.rank{

padding:15px;

background:white;

border-radius:10px;

margin-top:10px;

border:1px solid #ddd;

}



</style>


</head>



<body>


<div class="container">


<h1>
แบบฟอร์มวิเคราะห์ลูกค้า
(MANHARA Model)
</h1>


<p>
เครื่องมือช่วย Sales วิเคราะห์ความต้องการลูกค้า
เพื่อแนะนำผลิตภัณฑ์ที่เหมาะสม
</p>



<div class="section">


<label>
อายุ
</label>

<input id="age"
type="number"
placeholder="เช่น 45">



<label>
งบเบี้ยต่อปี
</label>

<input id="budget"
type="number"
placeholder="เช่น 50000">



<label>
Authority
</label>

<select id="authority"></select>


<label>
Need
</label>

<select id="need"></select>


<label>
Horizon
</label>

<select id="horizon"></select>


<label>
Attitude
</label>

<select id="attitude"></select>


<label>
Risk
</label>

<select id="risk"></select>


<label>
Action
</label>

<select id="action"></select>



<button onclick="analyze()">

วิเคราะห์แผนที่เหมาะสม

</button>



</div>



<div id="result"></div>


</div>





<script>


const API_URL =

"https://script.google.com/macros/s/AKfycbzCMY46Pg2NywlrIsikF7EcyGfmofgq0H3sDBLkvc6xyZ6OZM6Ti_jJ3Y8ex9lCiGRQ/exec";




// ============================
// LOAD DROPDOWN
// ============================


async function loadData(){


const res = await fetch(

API_URL+"?action=getDropdownData"

);


const json = await res.json();


const data=json.data;



createSelect(
"authority",
data.Authority
);


createSelect(
"need",
data.Need
);


createSelect(
"horizon",
data.Horizon
);


createSelect(
"attitude",
data.Attitude
);


createSelect(
"risk",
data.Risk
);


createSelect(
"action",
data.Action
);



}





function createSelect(id,list){


const el =
document.getElementById(id);


el.innerHTML =
"<option value=''>-- กรุณาเลือก --</option>";



list.forEach(x=>{


let op=document.createElement("option");


op.value=x;

op.textContent=x;


el.appendChild(op);



});


}






// ============================
// ANALYZE
// ============================


async function analyze(){



let params = new URLSearchParams({


action:"preview",


age:
document.getElementById("age").value,


budget:
document.getElementById("budget").value,


authority:
document.getElementById("authority").value,


need:
document.getElementById("need").value,


horizon:
document.getElementById("horizon").value,


attitude:
document.getElementById("attitude").value,


risk:
document.getElementById("risk").value,


plan_action:
document.getElementById("action").value


});




const res =
await fetch(
API_URL+"?"+params
);



const data =
await res.json();



showResult(data);



}






// ============================
// SHOW RESULT
// ============================


function showResult(data){



let html="";



html += `

<div class="card">


<h2>
${data.stars || ""}
${data.recommended_product}
</h2>


<h3>
${data.suitability}
</h3>


<h3>
คะแนน:
${data.score}
</h3>


</div>

`;





html += `

<div class="card">


<h3>
🏷 Customer Tag
</h3>


`;



(data.customer_tags||[])

.forEach(t=>{


html +=

`
<span class="tag">
${t}
</span>
`;



});



html += "</div>";







html +=`

<div class="card">


<h3>
เหตุผลที่แนะนำ
</h3>


<ul class="reason">

`;



(data.reason||[])

.forEach(r=>{


html +=

`
<li>
${r}
</li>
`;



});



html +=`

</ul>

</div>

`;







html +=`

<div class="card">


<h3>
รายละเอียดผลิตภัณฑ์
</h3>

<ul>

`;



(data.product_summary||[])

.forEach(s=>{


html +=

`
<li>
${s}
</li>
`;



});



html +=`

</ul>

</div>

`;







html +=`

<div class="card">


<h3>
Ranking
</h3>

`;



(data.ranked_products||[])

.forEach(p=>{


html +=`

<div class="rank">

${p.stars}

<b>
${p.product_name}
</b>

<br>

คะแนน:
${p.score}

</div>

`;



});



html +=`

</div>

`;



document.getElementById("result").innerHTML=html;



}




loadData();



</script>


</body>

</html>

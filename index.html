<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
MANHARA KKPGEN Insurance
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<div class="container">


<div class="header">

<h1>
แบบฟอร์มวิเคราะห์ลูกค้า
(MANHARA Model)
</h1>


<p>
เครื่องมือช่วย Sales วิเคราะห์ลูกค้า
เพื่อเสนอแผนประกันที่เหมาะสม
</p>


</div>



<div class="card">


<h2>
ข้อมูลลูกค้า
</h2>



<div class="grid">


<div>

<label>
อายุ
</label>

<input 
id="age"
type="number"
placeholder="เช่น 45">


</div>



<div>

<label>
รายได้ต่อเดือน
</label>

<input 
id="income"
type="number"
placeholder="เช่น 100000">


</div>


</div>




<label>
งบเบี้ยประกันต่อปี
</label>

<input 
id="budget"
type="number"
placeholder="เช่น 50000">





<h2>
A - Authority
</h2>


<select id="authority">

<option value="">
-- กรุณาเลือก --
</option>

</select>




<h2>
N - Need
</h2>


<div id="need">

</div>





<h2>
H - Horizon
</h2>


<select id="horizon">

<option value="">
-- กรุณาเลือก --
</option>

</select>





<h2>
A - Attitude
</h2>


<select id="attitude">

<option value="">
-- กรุณาเลือก --
</option>

</select>






<h2>
R - Risk
</h2>


<div id="risk">

</div>






<h2>
A - Action
</h2>


<select id="action">

<option value="">
-- กรุณาเลือก --
</option>

</select>






<br>


<button onclick="analyze()">

ประเมินแผนที่เหมาะสม

</button>



</div>





<div 
id="result"
class="card result"
>


<h2>
ผลการวิเคราะห์
</h2>


<div id="stars"
class="stars">
</div>



<h2 id="product">

</h2>


<h3 id="status">

</h3>



<p>
คะแนน:
<span id="score"></span>
</p>



<h3>
Tag ลูกค้า
</h3>

<div id="tags">

</div>




<h3>
รายละเอียดแผน
</h3>


<ul id="summary">

</ul>





<h3>
Ranking
</h3>


<div id="ranking">

</div>



</div>




</div>


<script src="app.js"></script>


</body>


</html>
